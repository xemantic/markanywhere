version=0.1.4-SNAPSHOT
kotlin.code.style=official
kotlin.js.generate.executable.default=false
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental.wasm=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
# 4g, not the 2g of the project template: this build links Kotlin/Native test
# binaries for ~16 targets in parallel, and the K/N backend runs in the daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true
#org.gradle.caching=true
org.gradle.parallel=true
