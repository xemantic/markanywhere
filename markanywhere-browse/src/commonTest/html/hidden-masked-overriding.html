<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Hidden masked fields, style getters overridden</title>
    <style>
        .pin { -webkit-text-security: disc; }
        .step { display: none; }
    </style>
    <script>
        // every way page script can make a masked field read as unmasked to script
        const unmasked = { getPropertyValue: () => 'none' };
        window.getComputedStyle = () => unmasked;
        CSSStyleDeclaration.prototype.getPropertyValue = () => 'none';
    </script>
</head>
<body>
<form>
<div class="step">
<input type="text" id="step-pin" class="pin" value="2222">
<input type="text" id="step-name" value="Alice">
<textarea id="step-note" class="pin">3333</textarea>
</div>
<div class="step">
<input type="text" id="owner-pin" class="pin" value="4444">
</div>
</form>
<script>
    // a field whose owner document claims another window
    Object.defineProperty(document.getElementById('owner-pin'), 'ownerDocument', {
        get: () => ({ defaultView: { getComputedStyle: () => unmasked } })
    });
</script>
<iframe id="frame" srcdoc="<script>getComputedStyle = () => ({ getPropertyValue: () => 'none' });</script><input type='text' id='frame-pin' style='display: none; -webkit-text-security: disc' value='8888'><input type='text' id='frame-name' style='display: none' value='Bob'>"></iframe>
</body>
</html>
