<!doctype html>
<html lang="en">
<head>
    <title>Blocked</title>
</head>
<body>
<h1>Blocked</h1>
<!-- The test pauses this request via the CDP Fetch domain and never answers it,
     standing in for a parser-blocking script the server never delivers: the
     parser stops here, so readyState stays "loading" and the paragraph below
     never reaches the DOM. -->
<script src="blocked.js"></script>
<p>After the script</p>
</body>
</html>
