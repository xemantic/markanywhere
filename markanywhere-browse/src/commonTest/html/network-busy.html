<!doctype html>
<html lang="en">
<head>
    <title>Network busy</title>
</head>
<body>
<!-- Fires a fresh (cache-busted) resource request every 100ms forever. Each
     URL is unique so the browser always issues a new requestWillBeSent; the
     in-flight set never stays at/below the idle threshold for a full idleTime
     window, so waitForNetworkIdle must hit its timeout cap and resolve false.
     The target file does not exist (loadingFailed) — that still exercises the
     requestWillBeSent -> settle bookkeeping the function under test relies on. -->
<script>
    setInterval(() => {
        const img = new Image();
        img.src = 'does-not-exist.png?x=' + Date.now() + '-' + Math.random();
        document.body.appendChild(img);
    }, 100);
</script>
</body>
</html>
