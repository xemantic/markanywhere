<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Secret names</title>
</head>
<body>
<span id="card-label">Card number</span>
<span id="exp-label">Expires</span>
<span id="order">Order 1234</span>
<input id="card-nbsp" autocomplete="cc-number">
<button id="b-card-nbsp" aria-labelledby="card-label card-nbsp"></button>
<input id="card-tabs" autocomplete="cc-number">
<button id="b-card-tabs" aria-labelledby="card-label card-tabs"></button>
<input id="exp-month" type="month" autocomplete="cc-exp" value="2027-05">
<button id="b-exp-month" aria-labelledby="exp-label exp-month"></button>
<input id="exp-date" type="date" autocomplete="cc-exp" value="2027-05-31">
<button id="b-exp-date" aria-labelledby="exp-label exp-date"></button>
<input id="exp-week" type="week" autocomplete="cc-exp" value="2027-W22">
<button id="b-exp-week" aria-labelledby="exp-label exp-week"></button>
<input id="exp-local" type="datetime-local" autocomplete="cc-exp" value="2027-05-31T10:30">
<button id="b-exp-local" aria-labelledby="exp-label exp-local"></button>
<input id="otp-time" type="time" autocomplete="one-time-code" value="10:30">
<button id="b-otp-time" aria-labelledby="exp-label otp-time"></button>
<input id="csc-number" type="number" autocomplete="cc-csc" value="987.50">
<button id="b-csc-number" aria-labelledby="exp-label csc-number"></button>
<input id="csc-thousand" type="number" autocomplete="cc-csc" value="4321">
<button id="b-csc-thousand" aria-labelledby="exp-label csc-thousand"></button>
<input id="card-million" type="number" autocomplete="cc-number" value="7654321">
<button id="b-card-million" aria-labelledby="exp-label card-million"></button>
<label id="pw-label">Password <input id="pw" type="password" value="1234"></label>
<button id="b-pw" aria-labelledby="pw-label"></button>
<button id="b-pw-direct" aria-labelledby="order pw"></button>
<input id="pw-typed" type="password" autocomplete="current-password">
<button id="b-pw-typed" aria-labelledby="pw-label pw-typed"></button>
<button id="b-order" aria-labelledby="order"></button>
<span id="code-label">Code</span>
<input id="pw-spaced" type=" password" value="5678">
<button id="b-pw-spaced" aria-labelledby="code-label pw-spaced"></button>
<script>
document.getElementById('card-nbsp').value = '4111 1111 1111 1111';
document.getElementById('card-tabs').value = '4111\t1111\t1111\t1112';
</script>
</body>
</html>
