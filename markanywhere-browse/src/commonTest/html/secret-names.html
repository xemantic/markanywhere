<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Secret names</title>
</head>
<body>
<span id="card-label">Card number</span>
<span id="exp-label">Expires</span>
<span id="order">Order 1234</span>
<input id="card-nbsp" autocomplete="cc-number">
<button id="b-card-nbsp" aria-labelledby="card-label card-nbsp"></button>
<input id="card-tabs" autocomplete="cc-number">
<button id="b-card-tabs" aria-labelledby="card-label card-tabs"></button>
<input id="exp-month" type="month" autocomplete="cc-exp" value="2027-05">
<button id="b-exp-month" aria-labelledby="exp-label exp-month"></button>
<input id="exp-date" type="date" autocomplete="cc-exp" value="2027-05-31">
<button id="b-exp-date" aria-labelledby="exp-label exp-date"></button>
<input id="exp-week" type="week" autocomplete="cc-exp" value="2027-W22">
<button id="b-exp-week" aria-labelledby="exp-label exp-week"></button>
<input id="exp-local" type="datetime-local" autocomplete="cc-exp" value="2027-05-31T10:30">
<button id="b-exp-local" aria-labelledby="exp-label exp-local"></button>
<input id="otp-time" type="time" autocomplete="one-time-code" value="10:30">
<button id="b-otp-time" aria-labelledby="exp-label otp-time"></button>
<input id="csc-number" type="number" autocomplete="cc-csc" value="987.50">
<button id="b-csc-number" aria-labelledby="exp-label csc-number"></button>
<input id="csc-thousand" type="number" autocomplete="cc-csc" value="4321">
<button id="b-csc-thousand" aria-labelledby="exp-label csc-thousand"></button>
<input id="card-million" type="number" autocomplete="cc-number" value="7654321">
<button id="b-card-million" aria-labelledby="exp-label card-million"></button>
<label id="pw-label">Password <input id="pw" type="password" value="1234"></label>
<button id="b-pw" aria-labelledby="pw-label"></button>
<button id="b-pw-direct" aria-labelledby="order pw"></button>
<input id="pw-typed" type="password" autocomplete="current-password">
<button id="b-pw-typed" aria-labelledby="pw-label pw-typed"></button>
<button id="b-order" aria-labelledby="order"></button>
<span id="code-label">Code</span>
<input id="pw-spaced" type=" password" value="5678">
<button id="b-pw-spaced" aria-labelledby="code-label pw-spaced"></button>
<select id="exp-m" autocomplete="cc-exp-month"><option>12</option><option selected>1</option></select>
<input id="cvc" autocomplete="cc-csc" value="123">
<input id="exp-1" type="date" autocomplete="cc-exp" value="2027-01-01">
<span id="step">Step <b>1</b> of 3</span>
<button id="b-step" aria-labelledby="step"></button>
<span id="copy">&copy; 2027 Acme</span>
<button id="b-copy" aria-labelledby="copy"></button>
<span id="items">10 items</span>
<button id="b-items" aria-labelledby="items"></button>
<span id="cart"><span aria-hidden="true">Basket icon</span> 1 item</span>
<button id="b-cart" aria-labelledby="cart"></button>
<button id="b-step-cvc" aria-labelledby="step cvc"></button>
<span id="owner" aria-owns="cvc-owned">Code</span>
<input id="cvc-owned" autocomplete="cc-csc" value="456">
<button id="b-owner" aria-labelledby="owner"></button>
<div id="host"></div>
<button id="b-host" aria-labelledby="host"></button>
<div id="hidden" style="display:none">Hidden <input autocomplete="cc-csc" value="789"></div>
<button id="b-hidden" aria-labelledby="hidden"></button>
<span id="pick">Pick <select autocomplete="cc-exp-month"><option>12</option><option selected>7</option></select></span>
<button id="b-pick" aria-labelledby="pick"></button>
<style>
.flex { display: flex; }
.first { order: -1; }
</style>
<div id="m-hidden-copy">Expiry month <span aria-hidden="true">05</span><select autocomplete="cc-exp-month"><option>01</option><option selected>05</option></select></div>
<button id="b-m-hidden-copy" aria-labelledby="m-hidden-copy"></button>
<div id="m-none-copy">CVC <input autocomplete="cc-csc" value="917"><span style="display:none">917</span></div>
<button id="b-m-none-copy" aria-labelledby="m-none-copy"></button>
<div id="m-script">CVC <input autocomplete="cc-csc" value="638"><script>638</script></div>
<button id="b-m-script" aria-labelledby="m-script"></button>
<div id="m-option">Card <select><option selected>A</option><option>4000 0566 5566 5556</option></select> <input autocomplete="cc-number" value="4000 0566 5566 5556"></div>
<button id="b-m-option" aria-labelledby="m-option"></button>
<div id="m-style">Code <input autocomplete="one-time-code" value="551177"><style>/*551177*/</style></div>
<button id="b-m-style" aria-labelledby="m-style"></button>
<div id="m-digits">PIN <input autocomplete="one-time-code" value="8 3 2"><span hidden>8</span><span hidden>3</span><span hidden>2</span></div>
<button id="b-m-digits" aria-labelledby="m-digits"></button>
<div id="m-unslotted">773</div>
<button id="b-m-unslotted" aria-labelledby="m-unslotted"></button>
<div id="m-order" class="flex">Code <span class="first" style="display:none">229</span><input autocomplete="cc-csc" value="229"></div>
<button id="b-m-order" aria-labelledby="m-order"></button>
<div id="m-twice">Exp <input autocomplete="cc-csc" value="404"><span aria-hidden="true">404</span></div>
<button id="b-m-twice" aria-labelledby="m-twice m-twice"></button>
<span id="m-owner" aria-owns="m-owned">Code <span aria-hidden="true">612</span></span>
<input id="m-owned" autocomplete="cc-csc" value="612">
<button id="b-m-owner" aria-labelledby="m-owner"></button>
<div id="m-none-target" style="display:none">Month <select autocomplete="cc-exp-month"><option selected>09</option></select></div>
<button id="b-m-none-target" aria-labelledby="m-none-target"></button>
<div id="m-noscript">CVC <input autocomplete="cc-csc" value="371"><template>371</template><noscript>371</noscript></div>
<button id="b-m-noscript" aria-labelledby="m-noscript"></button>
<div id="m-masked">Secret <input style="-webkit-text-security:disc" value="hunter"><span aria-hidden="true">hunter</span></div>
<button id="b-m-masked" aria-labelledby="m-masked"></button>
<div id="m-keypad">Enter PIN <input autocomplete="one-time-code" value="1357"><div aria-hidden="true"><button>1</button><button>3</button><button>5</button><button>7</button></div></div>
<button id="b-m-keypad" aria-labelledby="m-keypad"></button>
<div id="m-listbox">Expiry month <select autocomplete="cc-exp-month"><option>01</option><option selected>08</option></select><ul style="display:none"><li>01</li><li>08</li><li>12</li></ul></div>
<button id="b-m-listbox" aria-labelledby="m-listbox"></button>
<div id="m-inert">Code <input autocomplete="cc-csc" value="919"><span inert>919</span></div>
<button id="b-m-inert" aria-labelledby="m-inert"></button>
<div id="m-nested">Code <span aria-labelledby="m-nested-f">920</span></div>
<input id="m-nested-f" autocomplete="cc-csc" value="920">
<button id="b-m-nested" aria-labelledby="m-nested"></button>
<div id="m-nested-two">Code <span aria-labelledby="m-nested-two-f">944</span><span aria-labelledby="m-nested-two-g">x</span></div>
<input id="m-nested-two-f" autocomplete="cc-csc" value="944"><input id="m-nested-two-g" value="x">
<button id="b-m-nested-two" aria-labelledby="m-nested-two"></button>
<div id="m-nested-deep">Code <span aria-labelledby="m-nested-deep-f"><b>926</b></span><input id="m-nested-deep-f" autocomplete="cc-csc" value="926"></div>
<button id="b-m-nested-deep" aria-labelledby="m-nested-deep"></button>
<div id="m-nested-select">Month <span aria-labelledby="m-nested-select-f">07</span><select id="m-nested-select-f" autocomplete="cc-exp-month"><option>01</option><option selected>07</option></select></div>
<button id="b-m-nested-select" aria-labelledby="m-nested-select"></button>
<script>
document.getElementById('m-unslotted').attachShadow({mode: 'open'}).innerHTML =
    'Code <input autocomplete="cc-csc" value="773">';
document.getElementById('host').attachShadow({mode: 'closed'}).innerHTML =
    'Shadow <input autocomplete="cc-csc" value="321">';
document.getElementById('card-nbsp').value = '4111 1111 1111 1111';
document.getElementById('card-tabs').value = '4111\t1111\t1111\t1112';
</script>
</body>
</html>
