<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Form state</title>
</head>
<body>
<form>
<input type="text" id="name" name="name" value="preset">
<input type="text" id="untouched" name="untouched" value="kept">
<textarea id="bio" name="bio">old bio</textarea>
<select id="color" name="color"><option value="r">Red</option><option value="g">Green</option></select>
<input type="checkbox" id="agree" name="agree">
<input type="checkbox" id="news" name="news" checked>
<input type="password" id="secret" name="secret" value="markup-secret">
<input type="text" id="card" name="card" autocomplete="cc-number">
<input type="text" id="pin" name="pin" style="-webkit-text-security: disc">
</form>
</body>
</html>
