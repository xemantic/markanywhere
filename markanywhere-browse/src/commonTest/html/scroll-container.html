<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Scroll container</title>
</head>
<body>
<ul id="scrolling" role="presentation" style="overflow:auto;height:30px"><li>a</li><li>b</li><li>c</li><li>d</li></ul>
<ul id="sideways" role="presentation" style="overflow-x:auto;width:20px;white-space:nowrap"><li>aaaaaaaaaaaaaaaaaaaa</li></ul>
<ul id="clipped" role="presentation" style="overflow:hidden;height:30px"><li>a</li><li>b</li><li>c</li><li>d</li></ul>
<ul id="fitting" role="presentation" style="overflow-y:scroll;height:300px"><li>a</li></ul>
</body>
</html>
