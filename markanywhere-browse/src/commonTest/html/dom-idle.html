<!doctype html>
<html lang="en">
<head>
    <title>DOM idle</title>
</head>
<body>
<div id="root"></div>
<!-- Mutates the DOM a handful of times at 100ms intervals, then STOPS:
     the tree goes permanently quiet ~500ms after load, so waitForDomIdle
     must observe the quiet window and resolve true. -->
<script>
    let n = 0;
    const tick = () => {
        if (n++ < 5) {
            document.getElementById('root').appendChild(document.createElement('div'));
            setTimeout(tick, 100);
        }
    };
    setTimeout(tick, 100);
</script>
</body>
</html>
